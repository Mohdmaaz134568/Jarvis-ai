
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#eaf6ff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#0b1c30;border-bottom:1px solid #174767}
.logo{font-size:32px;color:#43d9ff;font-weight:bold;letter-spacing:5px}
.status{color:#70e7ba;font-size:13px;margin-top:8px}
#chat{height:60vh;overflow-y:auto;padding:16px}
.msg{padding:12px 14px;border-radius:14px;margin:10px 0;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.jarvis{background:#122c42;border:1px solid #1d5572}
.user{background:#075d78;margin-left:auto}
#controls{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0b1c30;border-top:1px solid #174767}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:#10273b;color:white;border:1px solid #28607b;border-radius:12px;padding:14px;font-size:16px}
button{border:0;border-radius:12px;padding:12px;background:#087ea4;color:white;font-size:15px}
button:disabled{opacity:.5}
.small{display:flex;justify-content:center;gap:10px;margin-top:10px}
.small button{background:#18354b}
.note{text-align:center;color:#8aaabe;font-size:12px;margin-top:9px}
</style>
</head>
<body>
<header>
  <div class="logo">J.A.R.V.I.S</div>
  <div>PERSONAL AI ASSISTANT</div>
  <div class="status" id="status">● SYSTEM READY</div>
</header>

<div id="chat">
  <div class="msg jarvis">Hello! Main Jarvis hoon. Mujhse Hindi ya English mein baat karo. 🎙️</div>
</div>

<div id="controls">
  <div class="row">
    <input id="message" placeholder="Jarvis se kuch poochho..." autocomplete="off">
    <button id="send">Send</button>
  </div>
  <div class="small">
    <button id="mic">🎤 Speak</button>
    <button id="voice">🔊 Voice: ON</button>
    <button id="clear">Clear chat</button>
  </div>
  <div class="note">Memory isi device ke browser mein save hoti hai.</div>
</div>

<script>
const WORKER_URL = "https://jarvis-ai-maaz.mohammadmaaz78690.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const voiceBtn = document.getElementById("voice");
const statusText = document.getElementById("status");

let voiceOn = true;
let recognition = null;
let busy = false;

function setStatus(text) {
  statusText.textContent = "● " + text;
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "hi-IN";
  utterance.rate = 0.94;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}

function getMemories() {
  try {
    return JSON.parse(localStorage.getItem("jarvis_memories") || "[]");
  } catch {
    return [];
  }
}

function saveMemory(fact) {
  const memories = getMemories();
  memories.push(fact);
  localStorage.setItem("jarvis_memories", JSON.stringify(memories));
}

function localReply(text) {
  const lower = text.toLowerCase().trim();

  const remember = text.match(
    /^(?:jarvis[, ]*)?(?:remember|save|note|yaad rakhna|yaad rakh|yaad karna|save karna)\s*(?:that|ki)?\s*[:,-]?\s*(.+)$/i
  );

  if (remember && remember[1]) {
    const fact = remember[1].trim();
    saveMemory(fact);
    return "Theek hai, maine ye baat is device ki memory mein save kar li: " + fact;
  }

  if (
    lower.includes("what do you remember") ||
    lower.includes("show memory") ||
    lower.includes("meri memory") ||
    lower.includes("kya yaad hai") ||
    lower.includes("memories dikhao")
  ) {
    const memories = getMemories();
    return memories.length
      ? "Mujhe ye baatein yaad hain:\n" + memories.map((m, i) => (i + 1) + ". " + m).join("\n")
      : "Abhi meri memory khaali hai. Koi baat yaad rakhne ko bolo.";
  }

  if (
    lower === "forget everything" ||
    lower === "clear memory" ||
    lower === "memory delete" ||
    lower === "sab bhool jao" ||
    lower === "memory saaf karo"
  ) {
    localStorage.removeItem("jarvis_memories");
    return "Theek hai, is device par save ki gayi memory delete kar di.";
  }

  return null;
}

async function sendMessage(text) {
  text = (text || "").trim();
  if (!text || busy) return;

  addMessage(text, "user");
  input.value = "";

  const local = localReply(text);
  if (local !== null) {
    addMessage(local, "jarvis");
    speak(local);
    return;
  }

  busy = true;
  sendBtn.disabled = true;
  setStatus("THINKING...");

  const placeholder = addMessage("Jarvis soch raha hai...", "jarvis");

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.details || data.error || ("HTTP " + response.status));
    }

    if (!data.reply) {
      throw new Error(data.error || "Worker se reply nahi mila.");
    }

    placeholder.textContent = data.reply;
    speak(data.reply);
    setStatus("SYSTEM ONLINE");
  } catch (error) {
    placeholder.textContent =
      "Connection error: " + error.message +
      "\nCloudflare Worker aur AI binding check karni hogi.";
    setStatus("CONNECTION ERROR");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

sendBtn.addEventListener("click", () => sendMessage(input.value));

input.addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage(input.value);
});

voiceBtn.addEventListener("click", () => {
  voiceOn = !voiceOn;
  voiceBtn.textContent = voiceOn ? "🔊 Voice: ON" : "🔇 Voice: OFF";
  if (!voiceOn && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
});

document.getElementById("clear").addEventListener("click", () => {
  chat.innerHTML = "";
  addMessage("Chat clear ho gayi. Batao, main kaise madad karun?", "jarvis");
});

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    micBtn.textContent = "🎙️ Listening...";
    setStatus("LISTENING...");
  };

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    sendMessage(input.value);
  };

  recognition.onerror = event => {
    setStatus("MIC: " + event.error);
    micBtn.textContent = "🎤 Speak";
  };

  recognition.onend = () => {
    micBtn.textContent = "🎤 Speak";
    if (!busy) setStatus("SYSTEM ONLINE");
  };

  micBtn.addEventListener("click", () => {
    try {
      recognition.start();
    } catch (error) {
      setStatus("MIC BUSY — TRY AGAIN");
    }
  });
} else {
  micBtn.addEventListener("click", () => {
    addMessage("Is browser mein voice recognition available nahi hai. Android par Chrome mein website kholkar try karo.", "jarvis");
  });
}

setStatus("SYSTEM ONLINE");
</script>
</body>
</html>
