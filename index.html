<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #eaf5ff;
    }
    .app {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }
    h1 { color: #55d8ff; text-align: center; }
    .status { text-align: center; color: #9ab6ca; font-size: 14px; }
    #chat {
      height: 55vh;
      min-height: 300px;
      overflow-y: auto;
      border: 1px solid #23435d;
      border-radius: 14px;
      padding: 12px;
      background: #0b1929;
      margin: 18px 0;
    }
    .msg {
      padding: 11px 13px;
      margin: 9px 0;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #174a69; margin-left: 28px; }
    .bot { background: #172b3d; margin-right: 18px; }
    .controls { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #31516a;
      background: #102238;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 15px;
      background: #19b9e8;
      color: #06121c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .secondary { background: #25445c; color: white; }
    .bottom { display: flex; gap: 8px; margin-top: 10px; }
    .bottom button { flex: 1; }
    #hint { color: #9ab6ca; font-size: 13px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>JARVIS AI</h1>
    <div class="status" id="status">Systems online</div>

    <div id="chat" aria-live="polite"></div>

    <div class="controls">
      <input id="entry" placeholder="Jarvis se kuch poochho..."
             autocomplete="off">
      <button id="send">Send</button>
    </div>

    <div class="bottom">
      <button id="mic" class="secondary">🎤 Mic</button>
      <button id="voice" class="secondary">🔊 Voice ON</button>
      <button id="clear" class="secondary">Clear</button>
    </div>
    <p id="hint">Mic ke liye browser permission allow karein.</p>
  </main>

  <script>
    const WORKER_URL =
      "https://jarvis-ai-maaz.mohammadmaaz78690.workers.dev";

    const $ = id => document.getElementById(id);
    let voiceEnabled = true;
    let busy = false;

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      $("chat").appendChild(div);
      $("chat").scrollTop = $("chat").scrollHeight;
    }

    function speak(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "hi-IN";
      utterance.rate = 0.95;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    async function send(text) {
      const value = (text ?? $("entry").value).trim();
      if (!value || busy) return;

      addMessage(value, "user");
      $("entry").value = "";
      busy = true;
      $("send").disabled = true;
      $("status").textContent = "Jarvis soch raha hai...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: value })
        });

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error("Worker ne valid JSON reply nahi diya.");
        }

        if (!response.ok) {
          throw new Error(
            data.error || data.details || ("HTTP error " + response.status)
          );
        }

        const answer = data.reply || data.response || data.text;
        if (!answer) {
          throw new Error("AI ka reply nahi mila. Worker response check karna hoga.");
        }

        addMessage(answer, "bot");
        speak(answer);
        $("status").textContent = "Systems online";
      } catch (error) {
        const message = "Jarvis error: " + error.message;
        addMessage(message, "bot");
        $("status").textContent = "Connection error";
      } finally {
        busy = false;
        $("send").disabled = false;
        $("entry").focus();
      }
    }

    $("send").addEventListener("click", () => send($("entry").value));

    $("entry").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        send($("entry").value);
      }
    });

    $("voice").addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      $("voice").textContent = voiceEnabled ? "🔊 Voice ON" : "🔇 Voice OFF";
      if (!voiceEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    });

    $("clear").addEventListener("click", () => {
      $("chat").replaceChildren();
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      addMessage("Chat clear ho gayi. Batao, main kaise madad karun?", "bot");
    });

    const Recognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Recognition) {
      const recognition = new Recognition();
      recognition.lang = "hi-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      $("mic").addEventListener("click", () => {
        try {
          $("status").textContent = "Sun raha hoon...";
          recognition.start();
        } catch (error) {
          $("status").textContent =
            "Mic pehle se chalu hai. Thodi der baad try karein.";
        }
      });

      recognition.onresult = event => {
        const spokenText = event.results[0][0].transcript;
        $("entry").value = spokenText;
        send(spokenText);
      };

      recognition.onerror = event => {
        $("status").textContent = "Mic error: " + event.error;
      };

      recognition.onend = () => {
        if ($("status").textContent === "Sun raha hoon...") {
          $("status").textContent = "Systems online";
        }
      };
    } else {
      $("mic").addEventListener("click", () => {
        $("hint").textContent =
          "Is browser mein voice recognition support nahi hai. Chrome mein try karein.";
      });
    }

    addMessage(
      "Namaste! Main Jarvis hoon. Mujhe message bhejkar test karein.",
      "bot"
    );
  </script>
</body>
</html>
