
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>JARVIS V14 | Ultimate AI</title>

<style>
:root {
  --bg:#080b12;
  --panel:#101722;
  --line:#26384b;
  --red:#ff454f;
  --cyan:#63eaff;
  --gold:#ffc76b;
  --text:#e9f4ff;
  --muted:#91a3b7;
}
* { box-sizing:border-box; }
body {
  margin:0; background:
  radial-gradient(ellipse at 50% -20%,#183047 0,transparent 55%),var(--bg);
  color:var(--text);font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
.app { max-width:1000px;margin:auto;padding:14px; }
header {
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;border-bottom:1px solid var(--line);padding:10px 0 16px;
}
.brand { display:flex;align-items:center;gap:12px; }
.logo {
  width:48px;height:48px;border:2px solid var(--cyan);border-radius:50%;
  display:grid;place-items:center;color:var(--cyan);font-size:24px;
  box-shadow:0 0 20px #63eaff35;
}
h1 { font-size:22px;letter-spacing:3px;margin:0; }
.subtitle { color:var(--muted);font-size:11px;margin-top:5px; }
.status { color:#76ffc0;font-size:11px;margin-top:6px; }
select,.btn {
  background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:10px;
}
.hud {
  margin:18px auto;max-width:260px;text-align:center;
}
.reactor {
  width:145px;height:145px;margin:auto;border-radius:50%;
  border:2px solid #36556b;display:grid;place-items:center;
  position:relative;
  background:radial-gradient(circle,#183044 0,#0b111a 65%);
  box-shadow:0 0 35px #63eaff17,inset 0 0 20px #63eaff12;
}
.reactor:before,.reactor:after {
  content:"";position:absolute;inset:9px;border-radius:50%;
  border:2px dashed var(--cyan);animation:spin 18s linear infinite;
}
.reactor:after {
  inset:20px;border-style:solid;border-color:var(--red);
  border-left-color:transparent;border-right-color:transparent;
  animation-direction:reverse;animation-duration:7s;
}
.core { font-size:38px;color:var(--cyan);z-index:1;text-shadow:0 0 20px var(--cyan); }
@keyframes spin { to { transform:rotate(360deg); } }
.hud-label { color:var(--cyan);font-size:11px;letter-spacing:3px;margin-top:12px; }
.clock { color:var(--gold);font-size:14px;margin-top:7px; }
.toolbar { display:flex;flex-wrap:wrap;gap:8px;margin:15px 0; }
.btn:hover { border-color:var(--cyan); }
.btn.primary { background:#123142;border-color:var(--cyan); }
.btn.danger { border-color:#77333c; }
.chat {
  min-height:250px;max-height:48vh;overflow:auto;
  border:1px solid var(--line);border-radius:15px;
  background:#0b111adf;padding:14px;
}
.msg { margin:0 0 15px;display:flex;flex-direction:column;gap:5px; }
.msg .who { color:var(--cyan);font-size:11px;letter-spacing:1px; }
.msg.user .who { color:var(--gold); }
.bubble {
  white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;
  background:var(--panel);border:1px solid #203043;
  border-radius:4px 13px 13px 13px;padding:12px;
}
.msg.user .bubble { background:#172334;border-color:#34465c; }
.bubble img { max-width:100%;border-radius:10px;display:block;margin-top:8px; }
.preview {
  display:none;margin:10px 0;padding:10px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);
}
.preview img { max-width:100%;max-height:200px;border-radius:8px; }
.preview button { margin-left:10px; }
.composer {
  margin-top:12px;border:1px solid var(--line);
  border-radius:15px;background:#0d141f;padding:10px;
}
textarea {
  width:100%;min-height:55px;max-height:150px;resize:vertical;
  border:0;outline:0;background:transparent;color:var(--text);
  padding:9px;font-size:16px;
}
.sendrow { display:flex;flex-wrap:wrap;gap:8px;align-items:center; }
.sendrow .send { margin-left:auto;background:var(--red);color:white;border:0; }
.small { font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px; }
#busy { color:var(--gold);font-size:12px;padding:8px 2px; }
footer { text-align:center;color:#657b90;font-size:10px;padding:20px 0; }
button:disabled { opacity:.5;cursor:wait; }
@media(max-width:480px) {
  .app { padding:10px; }
  h1 { font-size:18px; }
  .logo { width:42px;height:42px; }
  .reactor { width:125px;height:125px; }
  .chat { max-height:45vh; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; }
}
</style>
</head>

<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h1>J.A.R.V.I.S</h1>
      <div class="subtitle">PERSONAL AI SYSTEM · V14</div>
      <div class="status" id="status">● SYSTEM READY</div>
    </div>
  </div>
  <select id="language" aria-label="Response language">
    <option value="Hinglish">Hinglish</option>
    <option value="English">English</option>
  </select>
</header>

<section class="hud">
  <div class="reactor"><div class="core">J</div></div>
  <div class="hud-label">ARTIFICIAL INTELLIGENCE</div>
  <div class="clock" id="clock">--:--:--</div>
</section>

<div class="toolbar">
  <button class="btn" id="newChat">＋ New Chat</button>
  <button class="btn" id="historyBtn">◷ Chat History</button>
  <button class="btn" id="imageBtn">▧ Generate Image</button>
  <button class="btn" id="voiceBtn">🔊 Voice: OFF</button>
  <button class="btn" id="micBtn">🎙 Speak</button>
</div>

<div class="chat" id="chat" aria-live="polite"></div>
<div id="busy" hidden>JARVIS is thinking...</div>

<div class="preview" id="preview">
  <img id="previewImg" alt="Selected image preview">
  <span id="fileName"></span>
  <button class="btn danger" id="removeImage">Remove</button>
</div>

<div class="composer">
  <textarea id="prompt" placeholder="Hello, Sir! Ask me anything..." aria-label="Message"></textarea>
  <div class="sendrow">
    <button class="btn" id="uploadBtn">＋ Image</button>
    <button class="btn" id="stopVoice">■ Stop Voice</button>
    <button class="btn send" id="sendBtn">Send ➤</button>
  </div>
  <input type="file" id="imageFile" accept="image/*" hidden>
</div>

<div class="small">
  V14 · Smart Chat · Vision · Voice · Memory · Image Generation<br>
  AI features require a working Cloudflare Worker connection.
</div>
<footer>JARVIS V14 · PERSONAL AI INTERFACE</footer>
</div>

<script>
"use strict";

const WORKER_URL =
  "https://jarvis-ai-maaz.mohammadmaaz78690.workers.dev";

const $ = id => document.getElementById(id);
const chatEl = $("chat");
const promptEl = $("prompt");
const sendBtn = $("sendBtn");

let selectedImage = null;
let voiceEnabled = false;
let listening = false;
let busy = false;
let pendingImageQuestion = "";
let recognition = null;

let conversations = [];
let currentId = newId();
let history = [];

function newId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function currentLanguage() {
  return $("language").value;
}

function saveData() {
  try {
    localStorage.setItem("jarvis_v14_chats",
      JSON.stringify(conversations.slice(-30)));
    localStorage.setItem("jarvis_v14_current", currentId);
  } catch(e) {
    console.warn("Chat storage unavailable", e);
  }
}

function saveCurrent() {
  let c = conversations.find(x => x.id === currentId);
  if (!c) {
    c = {id:currentId,title:"New Chat",messages:[]};
    conversations.unshift(c);
  }
  c.messages = history.slice(-100);
  const first = history.find(m => m.role === "user");
  if (first) c.title = first.content.slice(0,45) || "Image chat";
  saveData();
}

function loadData() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("jarvis_v14_chats") || "[]");
    if (Array.isArray(saved)) conversations = saved;
    const id = localStorage.getItem("jarvis_v14_current");
    const c = conversations.find(x => x.id === id);
    if (c && Array.isArray(c.messages)) {
      currentId = c.id;
      history = c.messages;
    }
  } catch(e) {
    conversations = [];
    history = [];
  }
}

function renderHistory() {
  chatEl.replaceChildren();
  history.forEach(m => addMessage(
    m.role === "assistant" ? "JARVIS" : "Sir",
    m.content,
    m.role === "user"
  ));
}

function addMessage(who, content, isUser=false, imageUrl=null) {
  const wrap = document.createElement("div");
  wrap.className = "msg" + (isUser ? " user" : "");

  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who.toUpperCase();

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content || "";

  if (imageUrl && /^https?:\/\//i.test(imageUrl)) {
    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = "Generated image";
    img.referrerPolicy = "no-referrer";
    bubble.appendChild(img);
  }

  wrap.append(label,bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

function systemGreeting() {
  if (history.length) {
    renderHistory();
    return;
  }
  addMessage("JARVIS","Hello, Sir! 🤖\nHow can I help you today?");
}

function setStatus(message, isError=false) {
  $("status").textContent = (isError ? "● " : "● ") + message;
  $("status").style.color = isError ? "#ff737b" : "#76ffc0";
}

function setBusy(value) {
  busy = value;
  $("busy").hidden = !value;
  sendBtn.disabled = value;
  $("imageBtn").disabled = value;
  setStatus(value ? "PROCESSING REQUEST..." : "SYSTEM READY");
}

function speak(text) {
  if (!voiceEnabled || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = currentLanguage() === "English" ? "en-IN" : "en-IN";
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

function addHistory(role, content) {
  history.push({role,content});
  history = history.slice(-100);
  saveCurrent();
}

function calculate(text) {
  const s = text.trim()
    .replace(/,/g,"")
    .replace(/[×x]/g,"*")
    .replace(/÷/g,"/")
    .replace(/[−–]/g,"-")
    .replace(/\^/g,"**");

  if (!s || !/^[\d\s.+\-*/()%*]+$/.test(s)) return null;
  if (!/\d/.test(s) || !/[+\-*/%]/.test(s)) return null;
  if (s.length > 150 || /\/\s*0(?:\.0*)?(?!\d)/.test(s)) return null;

  try {
    const result = Function('"use strict";return (' + s + ')')();
    if (typeof result !== "number" || !Number.isFinite(result)) return null;
    return Number.isInteger(result) ? String(result) : String(Number(result.toPrecision(12)));
  } catch(e) {
    return null;
  }
}

async function callWorker(body) {
  const response = await fetch(WORKER_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });

  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw); }
  catch(e) {
    throw new Error("Worker returned an invalid response. Check Worker code.");
  }

  if (!response.ok || data.error) {
    throw new Error(data.error || "Request failed: HTTP " + response.status);
  }
  return data;
}

function extractText(data) {
  const value = data.reply ?? data.response ?? data.answer ??
    data.message ?? data.description ?? data.text;
  if (typeof value === "string") return value;
  if (value && typeof value === "object") {
    if (typeof value.response === "string") return value.response;
    if (typeof value.description === "string") return value.description;
  }
  return "";
}

function extractImage(data) {
  const value = data.image_url ?? data.imageUrl ??
    data.image ?? data.url ?? data.result?.image_url;

  if (typeof value === "string") {
    if (/^https?:\/\//i.test(value) || /^data:image\//i.test(value))
      return value;
  }

  if (Array.isArray(value) && value[0] &&
      typeof value[0].url === "string") return value[0].url;

  return null;
}

async function sendMessage() {
  if (busy) return;

  const question = promptEl.value.trim();
  if (!question && !selectedImage) return;

  if (selectedImage) {
    await analyzeImage(question || "Describe this image and its important details.");
    return;
  }

  const math = calculate(question);
  if (math !== null) {
    addMessage("Sir",question,true);
    addHistory("user",question);
    const answer = math + " ✅";
    addMessage("JARVIS",answer);
    addHistory("assistant",answer);
    promptEl.value = "";
    speak(answer);
    return;
  }

  addMessage("Sir",question,true);
  addHistory("user",question);
  promptEl.value = "";
  setBusy(true);

  try {
    const data = await callWorker({
      message:question,
      language:currentLanguage(),
      history:history.slice(-20),
      action:"chat"
    });

    const answer = extractText(data);
    if (!answer) throw new Error("Empty AI reply. Worker response format check karo.");

    addMessage("JARVIS",answer);
    addHistory("assistant",answer);
    speak(answer);
  } catch(e) {
    addMessage("JARVIS","Sorry, Sir. Connection mein problem hai.\n" + e.message);
    setStatus("CONNECTION ERROR",true);
  } finally {
    setBusy(false);
  }
}

function clearSelectedImage() {
  selectedImage = null;
  $("imageFile").value = "";
  $("preview").style.display = "none";
  $("previewImg").removeAttribute("src");
}

function readFile(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Image read nahi ho saki."));
    reader.readAsDataURL(file);
  });
}

$("uploadBtn").onclick = () => $("imageFile").click();
$("imageBtn").onclick = () => {
  if (selectedImage) {
    analyzeImage(promptEl.value.trim() ||
      "Describe this image and its important details.");
  } else {
    promptEl.placeholder = "Describe the image you want to generate...";
    promptEl.focus();
    pendingImageQuestion = "generate";
  }
};

$("imageFile").onchange = async event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Sir, please select an image file.");
    return;
  }
  if (file.size > 4 * 1024 * 1024) {
    alert("Image 4 MB se chhoti honi chahiye.");
    $("imageFile").value = "";
    return;
  }

  try {
    selectedImage = await readFile(file);
    $("previewImg").src = selectedImage;
    $("fileName").textContent = file.name;
    $("preview").style.display = "block";
    promptEl.placeholder = "Sir, image ke baare mein kya poochna hai?";
  } catch(e) {
    alert(e.message);
  }
};

$("removeImage").onclick = clearSelectedImage;

async function analyzeImage(question) {
  if (!selectedImage || busy) return;
  const image = selectedImage;
  const dataUrl = image;
  const actualQuestion = question || "Describe this image.";

  addMessage("Sir",actualQuestion || "Image uploaded.",true);
  addHistory("user",
    "[Image uploaded] " + actualQuestion);
  clearSelectedImage();
  promptEl.value = "";
  setBusy(true);

  try {
    const data = await callWorker({
      action:"analyzeImage",
      image:dataUrl,
      question:actualQuestion,
      language:currentLanguage(),
      history:history.slice(-20)
    });

    const answer = extractText(data);
    if (!answer) throw new Error("Vision model ne readable answer nahi diya.");

    addMessage("JARVIS",answer);
    addHistory("assistant",answer);
    speak(answer);
  } catch(e) {
    addMessage("JARVIS","Image analyze nahi ho saki, Sir.\n" + e.message);
    setStatus("IMAGE ERROR",true);
  } finally {
    setBusy(false);
  }
}

async function generateImage() {
  if (busy) return;
  const question = promptEl.value.trim();
  if (!question) {
    alert("Sir, image ka description likho.");
    return;
  }

  promptEl.value = "";
  addMessage("Sir","Generate image: " + question,true);
  addHistory("user","Generate image: " + question);
  setBusy(true);

  try {
    const data = await callWorker({
      type:"image",
      action:"generateImage",
      prompt:question,
      language:currentLanguage()
    });

    const imageUrl = extractImage(data);
    const answer = extractText(data) ||
      (imageUrl ? "Image generated, Sir! 🎨" :
        "Worker se image URL nahi mila.");

    addMessage("JARVIS",answer,false,imageUrl);
    addHistory("assistant",answer);
    if (imageUrl) addHistory("assistant","[Generated image: " + imageUrl + "]");
    if (!imageUrl) setStatus("IMAGE RESPONSE CHECK",true);
  } catch(e) {
    addMessage("JARVIS","Image generate nahi hui, Sir.\n" + e.message);
    setStatus("IMAGE ERROR",true);
  } finally {
    setBusy(false);
  }
}

$("sendBtn").onclick = () => {
  if (pendingImageQuestion === "generate" && !selectedImage) {
    pendingImageQuestion = "";
    promptEl.placeholder = "Hello, Sir! Ask me anything...";
    generateImage();
  } else {
    sendMessage();
  }
};

promptEl.addEventListener("keydown",e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

$("newChat").onclick = () => {
  if (busy) return;
  saveCurrent();
  currentId = newId();
  history = [];
  clearSelectedImage();
  promptEl.value = "";
  pendingImageQuestion = "";
  chatEl.replaceChildren();
  addMessage("JARVIS","Hello, Sir! 🤖\nHow can I help you today?");
  saveCurrent();
};

$("historyBtn").onclick = () => {
  if (busy) return;
  saveCurrent();
  if (!conversations.length) {
    alert("Sir, abhi koi saved chat nahi hai.");
    return;
  }
  const choices = conversations.slice(0,20)
    .map((c,i) => (i+1) + ". " + (c.title || "Chat").slice(0,50))
    .join("\n");
  const input = prompt("Saved chats:\n" + choices +
    "\n\nChat number enter karo:");
  if (input === null) return;
  const index = Number(input)-1;
  const c = conversations[index];
  if (!c) {
    alert("Invalid chat number.");
    return;
  }
  currentId = c.id;
  history = Array.isArray(c.messages) ? c.messages : [];
  renderHistory();
};

$("voiceBtn").onclick = () => {
  voiceEnabled = !voiceEnabled;
  $("voiceBtn").textContent =
    voiceEnabled ? "🔊 Voice: ON" : "🔊 Voice: OFF";
  if (!voiceEnabled && "speechSynthesis" in window)
    window.speechSynthesis.cancel();
};

$("stopVoice").onclick = () => {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  if (recognition && listening) recognition.stop();
};

$("micBtn").onclick = () => {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Sir, voice input is not supported in this browser. Chrome mein try karo.");
    return;
  }
  if (listening && recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = currentLanguage() === "English" ? "en-IN" : "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    $("micBtn").textContent = "🎙 Listening...";
    setStatus("LISTENING...");
  };
  recognition.onresult = event => {
    promptEl.value = event.results[0][0].transcript;
  };
  recognition.onerror = () => {
    setStatus("VOICE INPUT ERROR",true);
  };
  recognition.onend = () => {
    listening = false;
    $("micBtn").textContent = "🎙 Speak";
    setStatus("SYSTEM READY");
  };

  try { recognition.start(); }
  catch(e) { alert("Mic start nahi hua. Dobara try karo."); }
};

$("language").onchange = () => {
  localStorage.setItem("jarvis_v14_language",currentLanguage());
};

function updateClock() {
  $("clock").textContent = new Intl.DateTimeFormat("en-IN",{
    timeZone:"Asia/Kolkata",
    hour:"2-digit",minute:"2-digit",second:"2-digit",
    hour12:true
  }).format(new Date()) + " IST";
}

loadData();

const savedLanguage = localStorage.getItem("jarvis_v14_language");
if (savedLanguage === "English" || savedLanguage === "Hinglish") {
  $("language").value = savedLanguage;
}

systemGreeting();
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
