
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>JARVIS V11</title>
<style>
:root{--bg:#080b12;--panel:#111722;--gold:#ffc45c;--red:#ff4148;--cyan:#6beaff;--text:#edf3ff;--muted:#8c9ab0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#48251b 0,transparent 55%),var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:var(--text);background:#171e2b;border:1px solid #344052;border-radius:10px;padding:11px}
button:hover{border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.5}
.app{max-width:1250px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:245px 1fr}
aside{background:#0c111a;border-right:1px solid #293140;padding:16px;display:flex;flex-direction:column;gap:12px}
.brand{color:var(--gold);font-size:24px;font-weight:900;letter-spacing:3px}
.small{color:var(--muted);font-size:12px}
.nav{display:grid;gap:8px}
.nav button{text-align:left}
.nav button.active{border-color:var(--gold);background:#292117}
#history{display:grid;gap:5px;overflow:auto;max-height:38vh}
.hist{font-size:12px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0;padding:18px;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #293140;padding-bottom:13px}
h1{font-size:19px;margin:0}
.status{font-size:12px;color:var(--cyan);margin-top:5px}
.reactor{width:78px;height:78px;margin:22px auto;border-radius:50%;display:grid;place-items:center;border:3px solid var(--gold);box-shadow:0 0 14px #ffc45c66,inset 0 0 14px #ffc45c55;animation:pulse 2.4s infinite}
.reactor span{font-size:29px;color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
@keyframes pulse{50%{box-shadow:0 0 28px #ffc45caa,inset 0 0 20px #ffc45c77}}
#messages{flex:1;min-height:180px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:8px 0 18px}
.msg{max-width:90%;padding:12px 14px;border:1px solid #303c4e;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#282014;border-color:#8e672d}
.bot{align-self:flex-start;background:var(--panel)}
.msg img{max-width:100%;border-radius:8px}
#composer{display:flex;gap:8px;align-items:flex-end;border:1px solid #354052;background:#101621;border-radius:14px;padding:9px}
textarea,input,select{background:#0b1018;color:var(--text);border:1px solid #354052;border-radius:9px;padding:11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:45px;max-height:140px}
.gold{background:linear-gradient(135deg,#ffdf8b,#d89030);color:#17100a;font-weight:bold;border:0}
#panel{flex:1;padding:14px 0}
#panel h2{color:var(--gold)}
.field{display:grid;gap:7px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
footer{font-size:11px;color:var(--muted);padding:12px 0}
@media(max-width:650px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #293140;padding:12px}.brand{font-size:20px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:12px;text-align:center;padding:9px 4px}#history{max-height:110px;grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:12px;min-height:65dvh}.reactor{width:58px;height:58px;margin:14px auto}.reactor span{font-size:23px}.msg{max-width:96%}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">J.A.R.V.I.S.</div>
<div class="small">PERSONAL AI SYSTEM · V11</div>
<div class="nav">
<button id="newBtn">＋ New Chat</button>
<button data-page="chat" class="active">◈ Chat</button>
<button data-page="memory">▣ Memory</button>
<button data-page="settings">⚙ Settings</button>
</div>
<div class="small">CHAT HISTORY</div>
<div id="history"></div>
<div style="margin-top:auto" class="small">LOCAL STORAGE · V11</div>
</aside>
<main>
<header>
<div><h1 id="heading">JARVIS Interface</h1><div class="status" id="status">● SYSTEM READY</div></div>
<button id="voiceTest">🎙 Test Voice</button>
</header>
<section id="chatPage">
<div class="reactor"><span>✦</span></div>
<div id="messages"></div>
<form id="composer">
<button type="button" id="micBtn" title="Voice input">🎤</button>
<textarea id="prompt" placeholder="Ask JARVIS anything..." required></textarea>
<button type="submit" class="gold" id="sendBtn">➤</button>
</form>
<div class="row" style="margin-top:9px">
<button id="imageBtn">🖼 Image</button>
<button id="speakBtn">🔊 Read last reply</button>
<button id="stopBtn">■ Stop voice</button>
</div>
</section>
<section id="panel" class="hidden"></section>
<footer>JARVIS V11 · AI responses require your configured Cloudflare Worker.</footer>
</main>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const WORKER_DEFAULT="https://jarvis-ai-maaz.mohammadmaaz78690.workers.dev";
const safeRead=(key,fallback)=>{try{const x=JSON.parse(localStorage.getItem(key));return x??fallback}catch(e){return fallback}};
let chats=safeRead("j11chats",[]);
let memories=safeRead("j11memory",[]);
let current=null,busy=false,lastReply="";
function safeGet(key, fallback) {
  try {
    return localStorage.getItem(key) || fallback;
  } catch (e) {
    return fallback;
  }
}

let lang = safeGet("j11lang", "Hinglish");
let voiceName = safeGet("j11voice", "");
let worker = safeGet("j10worker", WORKER_DEFAULT);
function save(){try{localStorage.setItem("j11chats",JSON.stringify(chats));localStorage.setItem("j11memory",JSON.stringify(memories))}catch(e){alert("Storage full. Export your history first.")}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function chat(){return chats.find(c=>c.id===current)}
function newChat(){const c={id:id(),title:"New Chat",messages:[],updated:Date.now()};chats.unshift(c);current=c.id;save();renderHistory();showPage("chat");renderMessages()}
function renderHistory(){
 const root=$("history");root.replaceChildren();
 chats.slice(0,60).forEach(c=>{const b=document.createElement("button");b.className="hist";b.textContent=c.title||"Chat";b.title=c.title;b.onclick=()=>{current=c.id;showPage("chat");renderMessages();renderHistory()};root.append(b)});
}
function add(role,text,extra){
 let c=chat();if(!c){newChat();c=chat()}
 c.messages.push({role,text,...(extra||{}),time:Date.now()});
 if(role==="user"&&c.title==="New Chat")c.title=text.slice(0,36);
 c.updated=Date.now();chats.sort((a,b)=>b.updated-a.updated);save();renderHistory();renderMessages();
}
function renderMessages(){
 const root=$("messages");root.replaceChildren();
 const c=chat();
 if(!c||!c.messages.length){const d=document.createElement("div");d.className="small";d.style.textAlign="center";d.textContent="SYSTEM ONLINE · Send a message to begin.";root.append(d);return}
 c.messages.forEach(m=>{
  const d=document.createElement("div");d.className="msg "+(m.role==="user"?"user":"bot");
  const label=document.createElement("b");label.textContent=m.role==="user"?"YOU":"JARVIS";d.append(label,document.createElement("br"));
  if(m.image){const img=document.createElement("img");img.src=m.image;img.alt="Generated image";d.append(img)}
  const t=document.createElement("span");t.textContent=m.text||"";d.append(t);root.append(d);
 });root.scrollTop=root.scrollHeight;
}
function showPage(page){
 $("chatPage").classList.toggle("hidden",page!=="chat");$("panel").classList.toggle("hidden",page==="chat");
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 $("heading").textContent=page==="chat"?"JARVIS Interface":page==="memory"?"JARVIS Memory":"JARVIS Settings";
 if(page==="memory")renderMemory();if(page==="settings")renderSettings();
}
function renderMemory(){
 const p=$("panel");p.replaceChildren();
 const h=document.createElement("h2");h.textContent="Smart Memory";p.append(h);
 const note=document.createElement("p");note.className="small";note.textContent="Saved locally on this browser. Memories are not automatically shared with the AI.";p.append(note);
 const form=document.createElement("form");form.className="field";
 const input=document.createElement("input");input.placeholder="Add a fact to remember";input.required=true;
 const b=document.createElement("button");b.className="gold";b.textContent="Save Memory";
 form.append(input,b);form.onsubmit=e=>{e.preventDefault();memories.unshift({id:id(),text:input.value.trim()});save();renderMemory()};p.append(form);
 const search=document.createElement("input");search.placeholder="Search saved memories and chat history";search.style.margin="12px 0";p.append(search);
 const results=document.createElement("div");p.append(results);
 function draw(){results.replaceChildren();const q=search.value.toLowerCase();
  const items=[...memories.map(m=>({text:m.text,kind:"MEMORY",id:m.id})),...chats.flatMap(c=>c.messages.map(m=>({text:m.text||"",kind:c.title,chatId:c.id})))].filter(x=>x.text.toLowerCase().includes(q));
  items.slice(0,100).forEach(x=>{const d=document.createElement("div");d.className="msg bot";d.textContent=x.kind+": "+x.text;if(x.id){const del=document.createElement("button");del.textContent="Delete";del.onclick=()=>{memories=memories.filter(m=>m.id!==x.id);save();draw()};d.append(document.createElement("br"),del)}else if(x.chatId){const b=document.createElement("button");b.textContent="Open chat";b.onclick=()=>{current=x.chatId;showPage("chat");renderMessages()};d.append(document.createElement("br"),b)}results.append(d)});
 }
 search.oninput=draw;draw();
}
function renderSettings(){
 const p=$("panel");p.replaceChildren();
 const h=document.createElement("h2");h.textContent="Settings";p.append(h);
 function field(label,el){const d=document.createElement("label");d.className="field";d.textContent=label;d.append(el);p.append(d)}
 const url=document.createElement("input");url.value=worker;url.type="url";field("Cloudflare Worker URL",url);
 const language=document.createElement("select");["Hinglish","English"].forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;language.append(o)});language.value=lang;field("Reply language",language);
 const voice=document.createElement("select");voice.innerHTML='<option value="">Default device voice</option>';loadVoices(voice);voice.value=voiceName;field("Voice",voice);
 const saveBtn=document.createElement("button");saveBtn.className="gold";saveBtn.textContent="Save Settings";saveBtn.onclick=()=>{if(!url.value.startsWith("https://")){alert("Enter a valid HTTPS Worker URL.");return}worker=url.value.trim();lang=language.value;voiceName=voice.value;localStorage.setItem("j10worker",worker);localStorage.setItem("j11lang",lang);localStorage.setItem("j11voice",voiceName);alert("Settings saved.")};p.append(saveBtn);
 const test=document.createElement("button");test.textContent="Test AI Connection";test.style.marginLeft="8px";test.onclick=testConnection;p.append(test);
 const exp=document.createElement("button");exp.textContent="Export Chat History";exp.style.margin="14px 8px 0 0";exp.onclick=exportChats;p.append(exp);
 const imp=document.createElement("button");imp.textContent="Import History JSON";imp.onclick=importChats;p.append(imp);
 const del=document.createElement("button");del.textContent="Delete All Chats";del.style.margin="14px 0";del.onclick=()=>{if(confirm("Delete all chats on this browser?")){chats=[];current=null;save();renderHistory();renderMessages();alert("Chat history deleted.")}};p.append(del);
 const info=document.createElement("p");info.className="small";info.textContent="Your API key should remain inside Cloudflare Worker secrets, never in this page.";p.append(info);
}
function loadVoices(select){
 if(!("speechSynthesis" in window))return;
 function fill(){const old=select.value;select.replaceChildren(new Option("Default device voice",""));speechSynthesis.getVoices().forEach(v=>{const o=new Option(v.name+" ("+v.lang+")",v.name);select.append(o)});select.value=old||voiceName}
 fill();speechSynthesis.onvoiceschanged=fill;
}
async function askWorker(message,action){
 const url=worker.replace(/\/+$/,"");
 const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(action==="image"?{prompt:message,type:"image"}:{message,language:lang})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||"Worker HTTP "+response.status);
 return data;
}
async function send(message,action){
 if(busy)return;
 message=message.trim();if(!message)return;
 if(!chat())newChat();
 add("user",message);$("prompt").value="";busy=true;$("sendBtn").disabled=true;$("status").textContent="● PROCESSING...";
 try{
  const data=await askWorker(message,action);
  if(action==="image"){
   const url=data.image_url||data.url||data.result?.image_url;
   if(url){add("assistant","Image generated.",{image:url})}
   else if(data.image&&typeof data.image==="string"&&data.image.startsWith("data:image")){add("assistant","Image generated.",{image:data.image})}
   else add("assistant","Worker response received, but no image URL was found. The Worker must support the image request format.");
  }else{
   const reply=data.response||data.reply||data.text||data.result?.response||data.result?.reply;
   if(!reply)throw Error(data.error||"Worker response format not recognized.");
   lastReply=String(reply);add("assistant",lastReply);
  }
  $("status").textContent="● SYSTEM READY";
 }catch(e){add("assistant","Connection error: "+e.message+"\nCheck Worker URL, CORS and the Worker's expected request format.");$("status").textContent="● CONNECTION ERROR"}
 finally{busy=false;$("sendBtn").disabled=false;$("prompt").focus()}
}
async function testConnection(){
 try{$("status").textContent="● TESTING...";const r=await fetch(worker,{method:"OPTIONS"});alert("Worker endpoint responded to OPTIONS: HTTP "+r.status+". This does not yet confirm AI generation.");$("status").textContent="● ENDPOINT REACHED"}
 catch(e){alert("Connection test failed: "+e.message);$("status").textContent="● CONNECTION ERROR"}
}
function exportChats(){const blob=new Blob([JSON.stringify({chats,memories,language:lang},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jarvis-v11-history.json";a.click();URL.revokeObjectURL(a.href)}
function importChats(){const f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!Array.isArray(d.chats))throw Error("Invalid history file");if(!confirm("Import and merge chats?"))return;chats=[...d.chats,...chats].filter((c,i,a)=>a.findIndex(x=>x.id===c.id)===i);if(Array.isArray(d.memories))memories=[...d.memories,...memories];save();renderHistory();alert("Import complete.")}catch(e){alert("Import failed: "+e.message)}};f.click()}
$("newBtn").onclick=newChat;
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$("composer").onsubmit=e=>{e.preventDefault();send($("prompt").value,"chat")};
$("imageBtn").onclick=()=>{const prompt=$("prompt").value.trim();if(!prompt){alert("Pehle box mein image ka description likho.");$("prompt").focus();return}send(prompt,"image")};
$("voiceTest").onclick=()=>{if(!("speechSynthesis"in window)){alert("Device speech is not supported.");return}const u=new SpeechSynthesisUtterance("JARVIS system online.");const v=speechSynthesis.getVoices().find(v=>v.name===voiceName);if(v)u.voice=v;u.lang=lang==="Hinglish"?"hi-IN":"en-US";speechSynthesis.speak(u)};
$("speakBtn").onclick=()=>{if(!lastReply){alert("Abhi koi reply nahi hai.");return}if(!("speechSynthesis"in window))return alert("Speech not supported");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastReply);const v=speechSynthesis.getVoices().find(v=>v.name===voiceName);if(v)u.voice=v;u.lang=lang==="Hinglish"?"hi-IN":"en-US";speechSynthesis.speak(u)};
$("stopBtn").onclick=()=>{if("speechSynthesis"in window)speechSynthesis.cancel()};
$("micBtn").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Voice typing isn't supported in this browser. Try your keyboard's microphone.");return}const r=new SR();r.lang=lang==="Hinglish"?"hi-IN":"en-US";r.onresult=e=>$("prompt").value=e.results[0][0].transcript;r.onerror=e=>alert("Mic: "+e.error);r.start()};
window.addEventListener("error",e=>{$("status").textContent="● SCRIPT ERROR";console.error(e.message)});
if(!chats.length)newChat();else{current=chats[0].id;renderHistory();renderMessages()}
})();
</script>
</body>
</html>
