
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>JARVIS V15 Advanced</title>

<style>
:root {
  --bg:#050a14;
  --panel:#0b1424;
  --panel2:#101e31;
  --cyan:#54eaff;
  --blue:#168dff;
  --gold:#ffc96b;
  --text:#e7f5ff;
  --muted:#8ca6bd;
  --border:#223c53;
  --red:#ff3b59;
}
* {box-sizing:border-box}
body {
  margin:0;background:
  radial-gradient(ellipse at 50% 0%,#123352 0%,#08101e 38%,var(--bg) 78%);
  color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
}
button,input,textarea,select {font:inherit}
button {
  color:var(--text);background:var(--panel2);
  border:1px solid var(--border);border-radius:13px;
  padding:12px 15px;cursor:pointer;
}
button:active {transform:scale(.98)}
button:disabled {opacity:.5;cursor:wait}
header {padding:20px 16px 12px;text-align:center}
.logo {
  width:124px;height:124px;margin:0 auto 12px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  border:3px solid var(--cyan);
  box-shadow:0 0 20px #1edcff88,inset 0 0 24px #168dff55;
  animation:pulse 3s ease-in-out infinite;
}
.logo:before,.logo:after {
  content:"";position:absolute;border:1px dashed var(--cyan);
  border-radius:50%;inset:-12px;animation:spin 12s linear infinite;
}
.logo:after {inset:-22px;border-color:#168dff;animation-direction:reverse}
.logo span {font-size:18px;font-weight:bold;letter-spacing:2px}
@keyframes spin {to{transform:rotate(360deg)}}
@keyframes pulse {50%{box-shadow:0 0 36px #1edcffbb,inset 0 0 28px #168dff88}}
h1 {font-size:25px;letter-spacing:5px;margin:8px 0}
.sub {color:var(--muted);font-size:12px;letter-spacing:2px}
.status {
  display:inline-flex;align-items:center;gap:8px;
  margin-top:12px;padding:8px 13px;border:1px solid var(--border);
  border-radius:30px;color:var(--cyan);font-size:12px;
}
.dot {width:8px;height:8px;background:#44ffb1;border-radius:50%;box-shadow:0 0 10px #44ffb1}
.toolbar {
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;padding:10px 12px;
}
select {background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;max-width:100%}
main {max-width:850px;margin:auto;padding:8px 12px 18px}
.stats {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.stat {background:#0b1424bb;border:1px solid var(--border);border-radius:13px;padding:12px 6px;text-align:center}
.stat strong {display:block;color:var(--cyan);font-size:15px}
.stat small {display:block;color:var(--muted);font-size:10px;margin-top:5px}
.chat {
  height:min(47vh,510px);min-height:260px;overflow:auto;
  border:1px solid var(--border);border-radius:22px;
  padding:15px;background:#080e19dd;scroll-behavior:smooth;
}
.msg {margin:0 0 18px}
.who {font-size:12px;letter-spacing:2px;color:var(--cyan);margin-bottom:7px}
.msg.user .who {color:var(--gold)}
.bubble {
  background:#101b2b;border:1px solid #1c3044;
  padding:14px;border-radius:7px 18px 18px 18px;
  line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap;
}
.msg.user .bubble {background:#132439;border-radius:18px 7px 18px 18px}
.bubble img {display:block;max-width:100%;height:auto;max-height:440px;object-fit:contain;border-radius:12px;margin-top:10px}
.bubble a {color:var(--cyan)}
.image-actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.composer {margin-top:12px;background:#0b1424;border:1px solid var(--border);border-radius:20px;padding:12px}
textarea {
  width:100%;min-height:76px;max-height:180px;resize:vertical;
  background:transparent;border:0;outline:none;color:var(--text);
  padding:10px;font-size:16px;
}
.controls {display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.primary {background:var(--red);border-color:var(--red);font-weight:bold}
.accent {border-color:#237f9b;color:var(--cyan)}
footer {text-align:center;color:var(--muted);font-size:11px;padding:22px 10px 30px}
#fileInput {display:none}
#preview {display:none;max-width:110px;max-height:100px;border-radius:10px;margin:5px}
.notice {font-size:12px;color:var(--muted);padding:9px}
@media(min-width:650px) {
  header {padding-top:28px}
  .chat {height:490px}
}
</style>
</head>

<body>
<header>
  <div class="logo"><span>J.A.R.V.I.S</span></div>
  <h1>JARVIS</h1>
  <div class="sub">PERSONAL ARTIFICIAL INTELLIGENCE</div>
  <div class="status"><span class="dot"></span><span id="status">SYSTEM ONLINE</span></div>
  <div class="sub" id="clock" style="margin-top:12px"></div>
</header>

<div class="toolbar">
  <button id="newChat">＋ New Chat</button>
  <button id="historyBtn">▤ History</button>
  <select id="language" aria-label="Reply language">
    <option value="hinglish">Hinglish</option>
    <option value="english">English</option>
  </select>
  <button id="voiceToggle">🔊 Voice: OFF</button>
  <button id="speakBtn">🎙 Speak</button>
</div>

<main>
  <div class="stats">
    <div class="stat"><strong id="msgCount">0</strong><small>MESSAGES</small></div>
    <div class="stat"><strong id="mode">CHAT</strong><small>ACTIVE MODE</small></div>
    <div class="stat"><strong id="timeStat">READY</strong><small>SYSTEM STATUS</small></div>
  </div>

  <section class="chat" id="chat" aria-live="polite"></section>

  <div class="composer">
    <img id="preview" alt="Selected image preview">
    <textarea id="prompt" placeholder="Hello, Sir! Ask me anything..." aria-label="Message"></textarea>
    <div class="controls">
      <button id="uploadBtn">＋ Image</button>
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp">
      <button id="generateBtn" class="accent">▧ Generate Image</button>
      <button id="stopVoice">■ Stop Voice</button>
      <button id="sendBtn" class="primary" style="margin-left:auto">Send ➤</button>
    </div>
    <div class="notice" id="notice">Ready, Sir. Select an image or type a message.</div>
  </div>
</main>

<footer>
  JARVIS V15 · ADVANCED HUD · CHAT · VISION · IMAGE GENERATION · VOICE<br>
  AI features require an active Cloudflare Worker connection.
</footer>

<script>
"use strict";

const WORKER_URL =
  "https://jarvis-ai-maaz.mohammadmaaz78690.workers.dev";

const $ = id => document.getElementById(id);
const chat = $("chat");
const promptBox = $("prompt");
const fileInput = $("fileInput");

let messages = [];
let selectedImage = "";
let imageMode = false;
let voiceOn = false;
let busy = false;
let recognition = null;
let lastReply = "";
let chatId = String(Date.now());

const STORAGE_KEY = "jarvis_v15_chats";

function setStatus(text) {
  $("status").textContent = text;
  $("timeStat").textContent = busy ? "WORKING" : "READY";
}

function setBusy(value) {
  busy = value;
  $("sendBtn").disabled = value;
  $("generateBtn").disabled = value;
  $("sendBtn").textContent = value ? "Working…" : "Send ➤";
  setStatus(value ? "PROCESSING REQUEST" : "SYSTEM ONLINE");
}

function updateClock() {
  $("clock").textContent =
    new Intl.DateTimeFormat("en-IN", {
      timeZone: "Asia/Kolkata",
      dateStyle: "medium",
      timeStyle: "medium"
    }).format(new Date());
}
setInterval(updateClock, 1000);
updateClock();

function saveChats() {
  try {
    const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const index = all.findIndex(c => c.id === chatId);
    const entry = {
      id: chatId,
      title: (messages.find(m => m.role === "user")?.content || "New Chat").slice(0,70),
      messages: messages.slice(-80)
    };
    if (index >= 0) all[index] = entry;
    else all.unshift(entry);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all.slice(0,25)));
  } catch (e) {
    $("notice").textContent = "Browser storage full. Some history may not save.";
  }
}

function updateCounts() {
  $("msgCount").textContent = messages.length;
}

function addMessage(role, content, imageUrl = "") {
  const item = { role, content: String(content || ""), imageUrl };
  messages.push(item);

  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "assistant");

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "SIR" : "JARVIS";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = item.content;

  if (imageUrl && /^(https?:\/\/|data:image\/)/i.test(imageUrl)) {
    const img = document.createElement("img");
    img.alt = "Generated image";
    img.loading = "lazy";
    img.src = imageUrl;
    img.onerror = () => {
      img.alt = "Image could not be displayed. Please try again.";
      img.style.display = "none";
      const err = document.createElement("div");
      err.textContent = "Image display failed. Try generating again.";
      bubble.appendChild(err);
    };
    bubble.appendChild(img);

    const actions = document.createElement("div");
    actions.className = "image-actions";
    const open = document.createElement("button");
    open.textContent = "Open Image";
    open.onclick = () => {
      if (imageUrl.startsWith("https://") || imageUrl.startsWith("http://")) {
        window.open(imageUrl, "_blank", "noopener");
      } else {
        const win = window.open();
        if (win) {
          const im = win.document.createElement("img");
          im.src = imageUrl;
          im.style.maxWidth = "100%";
          win.document.body.appendChild(im);
        }
      }
    };
    actions.appendChild(open);
    bubble.appendChild(actions);
  }

  wrap.append(who, bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;

  updateCounts();
  saveChats();

  if (role === "assistant" && item.content) {
    lastReply = item.content;
    if (voiceOn) speak(item.content);
  }
}

function greet() {
  chat.innerHTML = "";
  messages = [];
  addMessage("assistant", "Hello, Sir! 🤖\nHow can I help you today?");
}

async function callWorker(payload) {
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const raw = await response.text();
  let data;

  try { data = JSON.parse(raw); }
  catch { throw new Error("Worker returned an invalid response. Check deployment."); }

  if (!response.ok || data.error || data.success === false) {
    throw new Error(data.error || "Worker request failed (" + response.status + ").");
  }

  return data;
}

function extractText(data) {
  const result = data?.result;
  if (typeof result === "string") return result;

  return data?.reply ||
    data?.response ||
    data?.answer ||
    data?.description ||
    data?.text ||
    result?.response ||
    result?.answer ||
    result?.caption ||
    "";
}

function extractImage(data) {
  const candidates = [
    data?.image_url,
    data?.imageUrl,
    data?.image,
    data?.url,
    data?.result?.image_url,
    data?.result?.imageUrl,
    data?.result?.image,
    data?.result?.url
  ];

  for (const value of candidates) {
    if (typeof value === "string" &&
        (/^https?:\/\//i.test(value) || /^data:image\//i.test(value))) {
      return value;
    }
  }
  return "";
}

function cleanPrompt() {
  return promptBox.value.trim();
}

async function sendMessage(forceImage = false) {
  if (busy) return;

  const question = cleanPrompt();
  if (!question && !selectedImage) return;

  const image = selectedImage;
  const generate = forceImage || imageMode;

  promptBox.value = "";
  selectedImage = "";
  imageMode = false;
  $("preview").style.display = "none";
  $("preview").removeAttribute("src");
  $("mode").textContent = "CHAT";

  const userText = image
    ? (question || "Describe this image.")
    : question;

  addMessage("user", generate ? "Generate image: " + userText : userText);
  setBusy(true);

  try {
    let data;

    if (generate) {
      $("mode").textContent = "IMAGE";
      data = await callWorker({
        type: "image",
        action: "generateImage",
        prompt: userText,
        language: $("language").value
      });

      const imageUrl = extractImage(data);

      if (imageUrl) {
        addMessage("assistant", extractText(data) || "Image generated, Sir!", imageUrl);
      } else {
        addMessage(
          "assistant",
          "Worker ne image data return nahi kiya. Cloudflare image response format check karna hoga."
        );
      }
    } else if (image) {
      $("mode").textContent = "VISION";
      data = await callWorker({
        action: "analyzeImage",
        image,
        question: question || "Describe this image in detail.",
        language: $("language").value,
        history: messages.slice(-12).map(m => ({
          role: m.role,
          content: m.content
        }))
      });

      const answer = extractText(data);
      addMessage("assistant", answer || "Image model ne text response nahi diya.");
    } else {
      data = await callWorker({
        action: "chat",
        message: question,
        language: $("language").value,
        history: messages.slice(-20).map(m => ({
          role: m.role,
          content: m.content
        }))
      });

      addMessage("assistant", extractText(data) || "Empty response from AI.");
    }
  } catch (error) {
    addMessage("assistant", "Sorry, Sir. " + error.message);
    setStatus("REQUEST ERROR");
  } finally {
    setBusy(false);
    promptBox.focus();
  }
}

$("sendBtn").addEventListener("click", () => sendMessage(false));

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage(false);
  }
});

$("generateBtn").addEventListener("click", () => {
  imageMode = true;
  $("mode").textContent = "IMAGE";
  promptBox.placeholder = "Describe the image you want, Sir...";
  promptBox.focus();
  $("notice").textContent = "Image mode ready. Enter a prompt and press Send.";
});

$("uploadBtn").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  if (!file) return;

  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
    $("notice").textContent = "Choose a PNG, JPG or WebP image.";
    fileInput.value = "";
    return;
  }

  if (file.size > 4 * 1024 * 1024) {
    $("notice").textContent = "Image must be smaller than 4 MB.";
    fileInput.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    selectedImage = String(reader.result);
    $("preview").src = selectedImage;
    $("preview").style.display = "block";
    $("notice").textContent = "Image ready. Ask a question and press Send.";
  };
  reader.onerror = () => {
    $("notice").textContent = "Could not read that image. Try again.";
  };
  reader.readAsDataURL(file);
});

$("newChat").addEventListener("click", () => {
  if (busy) return;
  chatId = String(Date.now());
  selectedImage = "";
  imageMode = false;
  promptBox.value = "";
  greet();
});

$("historyBtn").addEventListener("click", () => {
  try {
    const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!all.length) {
      alert("No saved chats yet, Sir.");
      return;
    }

    const menu = all.map((c,i) =>
      (i + 1) + ". " + (c.title || "Chat")
    ).join("\n");

    const choice = prompt("Enter chat number to open:\n\n" + menu);
    if (choice === null) return;

    const entry = all[Number(choice) - 1];
    if (!entry) {
      alert("Invalid chat number.");
      return;
    }

    chatId = entry.id;
    messages = [];
    chat.innerHTML = "";

    for (const m of entry.messages || []) {
      addMessage(m.role, m.content, m.imageUrl || "");
    }
    $("notice").textContent = "Previous chat loaded.";
  } catch {
    alert("Could not load saved history.");
  }
});

$("voiceToggle").addEventListener("click", () => {
  voiceOn = !voiceOn;
  $("voiceToggle").textContent = voiceOn ? "🔊 Voice: ON" : "🔊 Voice: OFF";
  $("notice").textContent = voiceOn
    ? "Voice replies enabled, Sir."
    : "Voice replies disabled.";
});

function speak(text) {
  if (!("speechSynthesis" in window)) {
    $("notice").textContent = "Speech output is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = $("language").value === "english" ? "en-IN" : "hi-IN";
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

$("speakBtn").addEventListener("click", () => {
  if (lastReply) speak(lastReply);
  else $("notice").textContent = "JARVIS has not replied yet.";
});

$("stopVoice").addEventListener("click", () => {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  if (recognition) {
    try { recognition.stop(); } catch {}
  }
  $("notice").textContent = "Voice stopped.";
});

$("speakBtn").addEventListener("contextmenu", event => {
  event.preventDefault();
  startListening();
});

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    $("notice").textContent =
      "Voice input is not supported in this browser. Type your message instead.";
    return;
  }

  if (recognition) {
    try { recognition.stop(); } catch {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = $("language").value === "english" ? "en-IN" : "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    $("notice").textContent = "Listening, Sir…";
    setStatus("LISTENING");
  };

  recognition.onresult = event => {
    promptBox.value = event.results[0][0].transcript;
    promptBox.focus();
    $("notice").textContent = "Voice captured. Press Send.";
  };

  recognition.onerror = event => {
    $("notice").textContent = "Voice input error: " + event.error;
  };

  recognition.onend = () => setStatus("SYSTEM ONLINE");

  try { recognition.start(); }
  catch { $("notice").textContent = "Could not start voice input."; }
}

$("speakBtn").addEventListener("dblclick", startListening);

greet();
setStatus("SYSTEM ONLINE");
</script>
</body>
</html>
