
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS V10</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eee;font:15px Arial}
header{padding:18px;text-align:center;border-bottom:1px solid #493a25;color:#ffc45c}
h1{margin:0;letter-spacing:4px}small{color:#70eaff}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px}
button,select{background:#171e2b;color:#eee;border:1px solid #485164;border-radius:9px;padding:10px}
button{cursor:pointer}button:hover{border-color:#ffc45c}
#history{display:flex;gap:5px;overflow-x:auto;padding:8px}
#history button{white-space:nowrap}
#messages{height:53vh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:12px;max-width:90%;line-height:1.5}
.user{align-self:flex-end;background:#46232c}.ai{align-self:flex-start;background:#171e2b;border:1px solid #303a4d}
form{display:flex;gap:7px;padding:10px}
textarea{flex:1;min-width:0;background:#111722;color:white;border:1px solid #485164;border-radius:10px;padding:12px;resize:vertical}
section{padding:12px}input{max-width:100%;background:#111722;color:white;padding:10px}
.hidden{display:none}.gold{color:#ffc45c}.status{padding:5px 12px;color:#70eaff;font-size:12px}
</style>
</head>
<body>
<header><h1>J.A.R.V.I.S.</h1><small>PERSONAL AI • V10</small></header>
<nav>
<button onclick="newChat()">＋ New Chat</button>
<button onclick="page('chat')">Chat</button>
<button onclick="page('memory')">Memory</button>
<button onclick="page('settings')">Settings</button>
<button onclick="speak('Hello Sir. Jarvis is ready.')">Test Voice</button>
</nav>
<div class="status" id="status">● READY</div>
<div id="history"></div>

<main id="chat">
<div id="messages"></div>
<form id="form">
<button type="button" onclick="listen()">🎙</button>
<textarea id="input" rows="2" placeholder="Message JARVIS..."></textarea>
<button id="send">➤</button>
</form>
</main>

<section id="memory" class="hidden">
<h3 class="gold">SMART MEMORY</h3>
<textarea id="note" rows="3" placeholder="Save a useful note..."></textarea>
<p><button onclick="saveNote()">Save Memory</button>
<button onclick="clearNotes()">Clear Memory</button></p>
<div id="notes"></div>
</section>

<section id="settings" class="hidden">
<h3 class="gold">SETTINGS</h3>
<p>Language:</p>
<select id="lang" onchange="localStorage.setItem('j10lang',this.value)">
<option value="hinglish">Hinglish</option><option value="english">English</option>
</select>
<p>Voice:</p><select id="voice"></select>
<p><button onclick="speak('Hello Sir. Voice system is ready.')">Test Voice</button>
<button onclick="speechSynthesis.cancel()">Stop Voice</button></p>
<p>Cloudflare Worker URL:</p>
<input id="worker" style="width:100%">
<p><button onclick="saveWorker()">Save Worker URL</button>
<button onclick="testWorker()">Test Connection</button></p>
<div id="test"></div>
<p><button onclick="exportChats()">Export Chat History</button>
<button onclick="clearChats()">Delete All Chats</button></p>
<p><small>Chats and memory are saved in this browser only.</small></p>
</section>

<script>
const $=id=>document.getElementById(id);
const DEFAULT_WORKER="https://jarvis-ai-maaz.mohammadmaaz78690.workers.dev";
let chats=read("j10chats",[]),notes=read("j10notes",[]);
let current=null,busy=false,voices=[];
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(){localStorage.setItem("j10chats",JSON.stringify(chats));renderHistory()}
function chat(){return chats.find(c=>c.id===current)}
function newChat(){
let c={id:Date.now().toString(36)+Math.random().toString(36).slice(2),title:"New Chat",messages:[]};
chats.unshift(c);current=c.id;save();render();page("chat")
}
function page(p){["chat","memory","settings"].forEach(x=>$(x).classList.toggle("hidden",x!==p));if(p==="memory")renderNotes()}
function renderHistory(){
$("history").replaceChildren();
chats.forEach(c=>{let b=document.createElement("button");b.textContent=c.title;b.onclick=()=>{current=c.id;render();page("chat")};$("history").append(b)})
}
function render(){
$("messages").replaceChildren();let c=chat();if(!c)return;
c.messages.forEach(m=>{let d=document.createElement("div");d.className="msg "+(m.role==="user"?"user":"ai");d.textContent=(m.role==="user"?"YOU\n":"JARVIS\n")+m.text;$("messages").append(d)});
$("messages").scrollTop=$("messages").scrollHeight
}
function add(role,text){
let c=chat();if(!c){newChat();c=chat()}
c.messages.push({role,text});
if(role==="user"&&c.title==="New Chat")c.title=text.slice(0,35);
save();render()
}
function contextFor(question){
let words=question.toLowerCase().split(/\W+/).filter(w=>w.length>2);
let old=[];
chats.filter(c=>c.id!==current).forEach(c=>c.messages.forEach(m=>{
if(words.some(w=>m.text.toLowerCase().includes(w)))old.push(m.role+": "+m.text)
}));
let recent=(chat()?.messages||[]).slice(-8).map(m=>m.role+": "+m.text);
return "RECENT CHAT:\n"+recent.join("\n")+"\nRELEVANT OLD HISTORY:\n"+old.slice(-5).join("\n")+
"\nSAVED NOTES:\n"+notes.map(n=>n.text).join("\n")
}
async function ask(){
let q=$("input").value.trim();if(!q||busy)return;
$("input").value="";add("user",q);busy=true;$("send").disabled=true;$("status").textContent="● THINKING";
let placeholder={role:"assistant",text:"One moment, Sir…"};chat().messages.push(placeholder);render();
try{
let lang=$("lang").value==="english"?"Reply in concise English.":"Reply in natural Roman Hinglish. Hindi must be written using English letters.";
let message=lang+"\nYou are JARVIS. Use this saved context only when relevant. Do not claim facts not present in it.\n"+contextFor(q)+"\nLATEST QUESTION:\n"+q;
let r=await fetch($("worker").value.trim(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,language:$("lang").value})});
let raw=await r.text(),data;try{data=JSON.parse(raw)}catch{data={response:raw}}
if(!r.ok)throw Error(data.error||"HTTP "+r.status);
let result=data.response||data.reply||data.output_text||data.result?.response||data.result?.reply;
if(typeof result!=="string")throw Error("Worker returned no readable answer");
placeholder.text=result;
}catch(e){placeholder.text="Connection error: "+e.message+". Check internet and Worker settings."}
finally{busy=false;$("send").disabled=false;$("status").textContent="● READY";save();render()}
}
$("form").addEventListener("submit",e=>{e.preventDefault();ask()});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
function renderNotes(){
$("notes").replaceChildren();
notes.forEach((n,i)=>{let d=document.createElement("p");d.textContent=n.text+" ";
let b=document.createElement("button");b.textContent="Delete";b.onclick=()=>{notes.splice(i,1);localStorage.setItem("j10notes",JSON.stringify(notes));renderNotes()};d.append(b);$("notes").append(d)})
}
function saveNote(){let t=$("note").value.trim();if(!t)return;notes.unshift({text:t});localStorage.setItem("j10notes",JSON.stringify(notes));$("note").value="";renderNotes()}
function clearNotes(){if(confirm("Delete all saved memories?")){notes=[];localStorage.setItem("j10notes","[]");renderNotes()}}
function speak(t){
if(!("speechSynthesis"in window)){alert("Voice not supported");return}
speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);
if($("voice").value!=="")u.voice=voices[+$("voice").value];
u.lang=$("lang").value==="english"?"en-US":"hi-IN";speechSynthesis.speak(u)
}
function loadVoices(){
if(!("speechSynthesis"in window))return;
voices=speechSynthesis.getVoices();let s=$("voice");s.replaceChildren(new Option("Default device voice",""));
voices.forEach((v,i)=>s.append(new Option(v.name+" ("+v.lang+")",i)))
}
function listen(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert("Voice input unavailable. Try Chrome.");return}
let r=new SR();r.lang=$("lang").value==="english"?"en-US":"hi-IN";
r.onresult=e=>{$("input").value=e.results[0][0].transcript;ask()};
r.onerror=()=>alert("Allow microphone permission and try again.");r.start()
}
function saveWorker(){
try{let u=new URL($("worker").value.trim());if(u.protocol!=="https:")throw Error();localStorage.setItem("j10worker",u.origin);$("worker").value=u.origin;alert("Worker URL saved")}
catch{alert("Enter a valid HTTPS Worker URL")}
}
async function testWorker(){
$("test").textContent="Testing...";
try{let r=await fetch($("worker").value.trim(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Reply only: connection ok",language:"english"})});$("test").textContent=r.ok?"Worker responded (HTTP "+r.status+")":"Worker error (HTTP "+r.status+")"}
catch(e){$("test").textContent="Connection failed: "+e.message}
}
function exportChats(){
let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({chats,notes},null,2)],{type:"application/json"}));a.href=u;a.download="jarvis-v10-history.json";a.click();URL.revokeObjectURL(u)
}
function clearChats(){if(confirm("Delete all saved chats?")){chats=[];current=null;save();newChat()}}
$("worker").value=localStorage.getItem("j10worker")||DEFAULT_WORKER;
$("lang").value=localStorage.getItem("j10lang")||"hinglish";
if(!chats.length)newChat();else{current=chats[0].id;renderHistory();render()}
loadVoices();if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=loadVoices;
</script>
</body>
</html>
